<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zanobia Sewing — Store Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body{background:#F1ECE3}
  .admin-top{background:var(--teal);color:var(--ivory);padding:12px 0}
  .admin-top .wrap{display:flex;align-items:center;gap:14px}
  .admin-top .brand{color:var(--ivory);font-size:22px}
  .admin-top .brand small{color:var(--gold)}
  .role-pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:4px 10px;border-radius:999px;font-weight:700}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 20px;overflow-x:auto}
  .tab{padding:12px 16px;font-weight:600;color:var(--stone);white-space:nowrap;border-bottom:2px solid transparent}
  .tab.on{color:var(--teal);border-color:var(--gold)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);background:#FBF8F1}
  tr:last-child td{border-bottom:0}
  .thumb{width:44px;height:56px;object-fit:cover;border-radius:6px;background:var(--sand)}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:capitalize}
  .pill.active{background:#e3f0e7;color:var(--ok)} .pill.draft{background:#f3e9d6;color:var(--gold)}
  .pill.archived{background:#eee;color:var(--stone)} .pill.paid{background:#e3f0e7;color:var(--ok)}
  .pill.pending{background:#fdf1d8;color:#8a6d1f} .pill.fulfilled{background:#e3ecf7;color:#2b5486} .pill.cancelled{background:#f6e7e9;color:var(--bad)}
  .mini{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff}
  .mini.dark{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mini.danger{color:var(--bad);border-color:#e7c9ce}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar h2{font-size:22px}
  .modal-scrim{position:fixed;inset:0;background:rgba(33,27,46,.5);display:none;place-items:center;z-index:80;padding:16px}
  .modal-scrim.on{display:grid}
  .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
  .modal header{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
  .modal .mbody{padding:20px}
  .login-box{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}
  .login-box h1{font-size:26px;margin-bottom:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .imgrow .ic{position:relative}
  .imgrow img{width:56px;height:72px;object-fit:cover;border-radius:6px}
  .imgrow .x{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px}
  .stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .stat .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:120px}
  .stat .box b{font-family:var(--display);font-size:26px;display:block}
  .stat .box span{font-size:12px;color:var(--stone)}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="admin-top"><div class="wrap">
  <a class="brand" href="/">Zanobia<small>Admin</small></a>
  <div style="flex:1"></div>
  <span class="role-pill hidden" id="rolePill"></span>
  <button class="mini hidden" id="logoutBtn">Sign out</button>
</div></div>

<div class="wrap" id="app"></div>

<div class="modal-scrim" id="modalScrim"><div class="modal" id="modal"></div></div>
<script src="/js/admin.js"></script>
</body>
</html>
